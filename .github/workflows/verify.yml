name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: verify never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.1.app || true
      - name: Install tools
        run: brew install swiftlint
      - name: make verify
        run: make verify
